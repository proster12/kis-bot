# 미국주식 브리핑 + 모의 운용 봇 설정
# 이 파일만 고치면 종목·규칙을 바꿀 수 있습니다.

# 관심종목: 저장소 최상위의 universe.txt (한투 봇과 같은 목록)를 읽습니다.
# 그 파일이 없을 때만 아래 watchlist를 씁니다.
watchlist_file: ../universe.txt
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - TSLA

# 매매 신호 규칙
signals:
  rsi_period: 14        # RSI 계산 기간(일)
  rsi_buy: 30           # RSI가 이 값 아래면 과매도 → 매수 후보
  rsi_sell: 70          # RSI가 이 값 위면 과매수 → 매도 후보
  sma_fast: 20          # 단기 이동평균(일)
  sma_slow: 50          # 장기 이동평균(일)

# 가상 매매(모의 운용) — 실제 주문은 내지 않습니다
paper:
  starting_cash_usd: 10000   # 가상 시작 자금
  order_usd: 1000            # 매수 1회 금액
  max_positions: 5           # 동시에 보유할 최대 종목 수
  stop_loss_pct: 8           # 매수가 대비 -8%면 손절
  take_profit_pct: 20        # 매수가 대비 +20%면 익절
  fee_pct: 0.25              # 매매 수수료(%) — 한투 미국주식 수수료에 맞게 조정
  cooldown_days: 5           # 매도한 종목은 며칠 동안 다시 사지 않음

# 뉴스·내부자 거래
news:
  per_ticker: 3              # 종목당 뉴스 개수
insider:
  lookback_days: 14          # 최근 며칠간의 내부자 거래를 볼지
  max_filings_per_ticker: 15 # 종목당 확인할 최대 공시 수(SEC 요청 수 제한용)
