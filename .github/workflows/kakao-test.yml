name: 카카오 알림 테스트

# 카톡 연결만 확인합니다. Actions 화면에서 'Run workflow'로 실행하세요.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "briefing/notify_test.py"
      - "briefing/bot/notify.py"
      - ".github/workflows/kakao-test.yml"

permissions:
  contents: read

jobs:
  kakao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: briefing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 카톡 테스트 메시지 보내기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python notify_test.py
